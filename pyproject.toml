[project]
name = "mcp-job-postings-server"
version = "0.1.0"
description = "MCP server with tools over a sample job-postings dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
]
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
